name: Build & Release WireTapper Binaries

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r WireTapper.txt
          pip install pyinstaller

      - name: Build Standalone Windows Executable
        run: |
          pyinstaller --noconfirm --onefile --name WireTapper-Windows --add-data "templates;templates" --add-data "static;static" --add-data "uploads;uploads" app.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireTapper-Windows
          path: dist/WireTapper-Windows.exe

  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r WireTapper.txt
          pip install pyinstaller

      - name: Build Standalone Linux Executable
        run: |
          pyinstaller --noconfirm --onefile --name WireTapper-Linux --add-data "templates:templates" --add-data "static:static" --add-data "uploads:uploads" app.py

      - name: Upload Linux Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireTapper-Linux
          path: dist/WireTapper-Linux

  build-macos:
    name: Build macOS Executable
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r WireTapper.txt
          pip install pyinstaller

      - name: Build Standalone macOS Executable
        run: |
          pyinstaller --noconfirm --onefile --name WireTapper-macOS --add-data "templates:templates" --add-data "static:static" --add-data "uploads:uploads" app.py

      - name: Upload macOS Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireTapper-macOS
          path: dist/WireTapper-macOS

  create-release:
    name: Publish Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release and Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/WireTapper-Windows/WireTapper-Windows.exe
            release-artifacts/WireTapper-Linux/WireTapper-Linux
            release-artifacts/WireTapper-macOS/WireTapper-macOS
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ""
